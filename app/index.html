<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Pulse</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="dashboard">
    <header class="dashboard-header">
      <p class="eyebrow">Team overview</p>
      <h1>Project Pulse</h1>
      <p>Stay current on project ownership, status, activity, and priority.</p>
    </header>

    <section id="projects" class="projects-grid" aria-label="Project status cards"></section>
  </main>

  <script>
    fetch('project-data.json')
      .then(response => {
        if (!response.ok) {
          throw new Error('Unable to load project data.');
        }
        return response.json();
      })
      .then(data => {
        const container = document.getElementById('projects');

        data.projects.forEach(project => {
          const card = document.createElement('article');
          card.className = 'project-card';

          card.innerHTML = `
            <div class="card-heading">
              <div>
                <p class="owner">Owner: ${project.owner}</p>
                <h2>${project.name}</h2>
              </div>
              <span class="status-badge">${project.status}</span>
            </div>

            <dl>
              <div>
                <dt>Status</dt>
                <dd>${project.status}</dd>
              </div>
              <div>
                <dt>Recent activity</dt>
                <dd>${project.recentActivity}</dd>
              </div>
              <div>
                <dt>Priority</dt>
                <dd>${project.priority}</dd>
              </div>
            </dl>
          `;

          container.appendChild(card);
        });
      })
      .catch(error => {
        document.getElementById('projects').textContent = error.message;
      });
  </script>
</body>
</html>
